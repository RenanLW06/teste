<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma de Gestão de Crianças e Salas</title>
<style>
:root{--red:#a93428;--red2:#c84935;--orange:#e87532;--ink:#252525;--muted:#707782;--line:#e9e7e4;--bg:#f6f6f5;--white:#fff;--soft:#fff3ed;--green:#237b54;--shadow:0 8px 28px #2b1b120c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:68px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.02em}.brandmark{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:20px}.brand small{display:block;font-size:11px;color:#f8d8d1;font-weight:500;letter-spacing:0}.topright{display:flex;align-items:center;gap:12px}.profile-switch{background:#8e2b22;border:1px solid #ffffff55;color:white;padding:8px 12px;border-radius:9px}.user-chip{font-size:12px;color:#ffe8e2}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}.nav-label{font-size:10px;font-weight:800;letter-spacing:.12em;color:#9a9a9a;padding:0 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#565b62;display:flex;align-items:center;gap:11px;font-weight:600}.nav button:hover{background:#faf1ed}.nav button.active{background:var(--soft);color:var(--red);font-weight:750}.ico{width:20px;text-align:center;font-size:17px}.aside-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px;color:var(--muted);font-size:11px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.page-head h1{margin:4px 0 4px;font-size:26px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:#343434;border-radius:9px;padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#d4b0a5;background:#fffaf8}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.primary:hover{background:#8f2b22}.btn.orange{background:var(--orange);color:white;border-color:var(--orange)}.btn.danger{color:#a52b25;border-color:#f0c9c5}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat-icon{width:37px;height:37px;background:var(--soft);color:var(--red);border-radius:10px;display:grid;place-items:center;font-size:18px}.stat strong{display:block;font-size:28px;letter-spacing:-.04em;margin-top:10px}.muted{color:var(--muted)}.smalltext{font-size:12px}.section-title{font-size:15px;font-weight:750;margin:0 0 13px}.split{grid-template-columns:1.35fr 1fr}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px;text-align:left;font-weight:650}.quick button span{display:block;color:var(--muted);font-size:11px;font-weight:450;margin-top:4px}.quick button:hover{border-color:#e3b7a8;background:#fffaf8}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #efeeec;font-size:13px}th{background:#faf9f8;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#f0f1f2;color:#5b6066;font-size:11px;font-weight:700}.pill.green{background:#e8f5ee;color:#237b54}.pill.red{background:#fff0ed;color:#a93428}.pill.orange{background:#fff3e5;color:#a95b18}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#555}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #deddda;border-radius:8px;padding:10px 11px;background:#fff;outline:none;color:#292929}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#d17b62;box-shadow:0 0 0 3px #d17b621c}.search{max-width:300px}.empty{padding:28px;text-align:center;color:var(--muted)}.empty b{display:block;color:#444;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px 14px;background:#fff7ed;border:1px solid #f4ddc3;border-radius:10px;color:#83511e;font-size:12px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:15px}.tabs button{border:0;background:none;padding:10px 12px;color:#777;border-bottom:2px solid transparent}.tabs button.active{color:var(--red);border-color:var(--red);font-weight:750}.timeline{border-left:2px solid #f0d4ca;margin:8px 0 0 7px;padding-left:17px;display:grid;gap:15px}.timeline-item{position:relative}.timeline-item:before{content:"";position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--orange)}.modal-back{position:fixed;inset:0;background:#17171766;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.x{border:0;background:#f3f3f3;border-radius:8px;width:32px;height:32px;font-size:18px}.toast{position:fixed;right:20px;bottom:20px;background:#262626;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none}.toast.show{display:block}.filebox{border:1px dashed #d9b2a5;border-radius:12px;padding:24px;text-align:center;background:#fffaf8}.filebox input{max-width:100%}.footer-note{font-size:11px;color:#929292;margin-top:20px}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:sticky;top:68px;z-index:4;padding:9px 12px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav-label,.aside-foot{display:none}.nav{display:flex;min-width:max-content}.nav button{padding:9px 11px;font-size:12px}.main{padding:20px 15px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
@media(max-width:520px){.topbar{padding:0 13px}.brand{font-size:12px}.brandmark{width:33px;height:33px}.user-chip{display:none}.main{padding:17px 12px}.page-head h1{font-size:22px}.stats{gap:9px}.card{padding:13px}.stat strong{font-size:24px}.two{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">✳</div><div>PLATAFORMA DE GESTÃO<small>Crianças e Salas</small></div></div><div class="topright"><span class="user-chip" id="who">Acesso demonstrativo</span><select class="profile-switch" id="roleSelect" aria-label="Perfil de acesso"><option value="Administrador">Administrador (ADM)</option><option value="Monitor">Monitor</option></select></div></header>
<div class="layout"><aside><div class="nav-label">MENU PRINCIPAL</div><nav class="nav" id="nav"></nav><div class="aside-foot">Plataforma de Gestão de Crianças e Salas<br>Prévia funcional · dados locais demonstrativos</div></aside><main class="main" id="main"></main></div></div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Cadastro</h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const icons={"Visão geral":"▦","Minha sala":"⌂","Crianças":"♧","Ficha individual":"▤","Salas e turmas":"▦","Presença":"✓","Monitores":"♙","Importação":"⇧","Histórico e auditoria":"◷"};
const adminNav=["Visão geral","Crianças","Salas e turmas","Presença","Monitores","Importação","Histórico e auditoria"];
const monitorNav=["Minha sala","Crianças"];
let role="Administrador",page="Visão geral",selectedChild=null,childTab="Dados cadastrais",importRows=[],importErrors=[];
const seed={children:[
{id:1,name:"Criança demonstrativa 01",birth:"2017-04-08",room:"Sala A",classroom:"Turma 1",status:"Ativa",observations:[{date:"2026-11-05",category:"Observação",text:"Registro demonstrativo para visualizar o histórico.",author:"Monitor"}],attendance:{"2026-11-06":"Presente"}},
{id:2,name:"Criança demonstrativa 02",birth:"2018-02-14",room:"Sala A",classroom:"Turma 1",status:"Ativa",observations:[],attendance:{}},
{id:3,name:"Criança demonstrativa 03",birth:"2016-09-22",room:"Sala B",classroom:"Turma 2",status:"Ativa",observations:[],attendance:{}},
{id:4,name:"Criança demonstrativa 04",birth:"2019-01-12",room:"Sala B",classroom:"Turma 2",status:"Inativa",observations:[],attendance:{}}
],rooms:[{id:1,name:"Sala A",classroom:"Turma 1",monitor:"Monitor demonstrativo 01",active:true},{id:2,name:"Sala B",classroom:"Turma 2",monitor:"Monitor demonstrativo 02",active:true}],monitors:[{id:1,name:"Monitor demonstrativo 01",room:"Sala A",active:true},{id:2,name:"Monitor demonstrativo 02",room:"Sala B",active:true}],audit:[]};
let db;try{db=JSON.parse(localStorage.getItem("gestaoCriancasDemo"))||seed}catch(e){db=seed}
function save(){localStorage.setItem("gestaoCriancasDemo",JSON.stringify(db))}
function log(action,detail){db.audit.unshift({date:new Date().toLocaleString("pt-BR"),action,detail,author:role});save()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateBR(d){if(!d)return "—";let p=d.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function toast(t){$("#toast").textContent=t;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),2600)}
function allowed(p){return role==="Administrador"?adminNav.includes(p):monitorNav.includes(p)}
function go(p){if(!allowed(p))return;page=p;render()}
$("#roleSelect").addEventListener("change",e=>{role=e.target.value;page=role==="Administrador"?"Visão geral":"Minha sala";render()});
function renderNav(){let items=role==="Administrador"?adminNav:monitorNav;$("#nav").innerHTML=items.map(p=>`<button class="${page===p?"active":""}" onclick="go('${p}')"><span class="ico">${icons[p]}</span>${p}</button>`).join("")}
function head(kicker,title,sub,action=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function stat(label,value,ico){return `<div class="card"><div class="stat"><div class="muted smalltext">${label}</div><div class="stat-icon">${ico}</div></div><strong>${value}</strong><div class="muted smalltext">Visão da operação</div></div>`}
function activeChildren(){return db.children.filter(c=>c.status==="Ativa"&&(role==="Administrador"||c.room==="Sala A"))}
function render(){renderNav();$("#who").textContent=role==="Administrador"?"Acesso geral à operação":"Acesso às salas atribuídas";let html="";
if(page==="Visão geral")html=dashboard();
if(page==="Minha sala")html=monitorHome();
if(page==="Crianças")html=childrenPage();
if(page==="Ficha individual")html=childPage();
if(page==="Salas e turmas")html=roomsPage();
if(page==="Presença")html=attendancePage();
if(page==="Monitores")html=monitorsPage();
if(page==="Importação")html=importPage();
if(page==="Histórico e auditoria")html=auditPage();
$("#main").innerHTML=html+`<div class="footer-note">Prévia funcional baseada na apresentação conceitual. Dados fictícios armazenados somente neste navegador.</div>`;
}
function dashboard(){let active=db.children.filter(c=>c.status==="Ativa").length,rooms=db.rooms.filter(r=>r.active).length,turmas=new Set(db.rooms.map(r=>r.classroom)).size,present=db.children.filter(c=>c.status==="Ativa"&&c.attendance?.[today()]==="Presente").length;return head("Painel administrativo","Visão geral","Acompanhe os principais indicadores e ações da operação.",`<button class="btn primary" onclick="openChild()">＋ Nova criança</button>`)+`<div class="grid stats">${stat("Total de crianças",db.children.length,"♧")}${stat("Salas ativas",rooms,"▦")}${stat("Turmas",turmas,"▤")}${stat("Presenças hoje",present,"✓")}</div><div class="grid split"><section class="card"><h3 class="section-title">Acesso rápido</h3><div class="quick"><button onclick="go('Crianças')">♧ Crianças<span>Consultar e editar cadastros</span></button><button onclick="go('Presença')">✓ Presença<span>Registrar frequência e faltas</span></button><button onclick="go('Salas e turmas')">▦ Salas e turmas<span>Organizar vínculos</span></button><button onclick="go('Importação')">⇧ Importação<span>Enviar planilhas Excel ou CSV</span></button></div></section><section class="card"><h3 class="section-title">Atividade recente</h3>${db.audit.length?`<div class="timeline">${db.audit.slice(0,4).map(a=>`<div class="timeline-item"><b>${esc(a.action)}</b><div class="muted smalltext">${esc(a.detail)}</div><div class="muted smalltext">${esc(a.date)} · ${esc(a.author)}</div></div>`).join("")}</div>`:`<div class="empty">Nenhuma alteração registrada ainda.</div>`}</section></div>`}
function monitorHome(){let room=db.rooms[0]?.name||"Sala atribuída";let kids=db.children.filter(c=>c.room===room&&c.status==="Ativa");return head("Área do monitor","Minha sala","Consulte as crianças vinculadas e registre observações individuais.")+`<div class="grid stats">${stat("Sala",esc(room),"⌂")}${stat("Total de crianças",kids.length,"♧")}</div><section class="card"><h3 class="section-title">Crianças vinculadas</h3>${kids.length?tableChildren(kids):`<div class="empty">Nenhuma criança vinculada a esta sala.</div>`}</section>`}
function tableChildren(list){return `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Nascimento</th><th>Sala / turma</th><th>Status</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${dateBR(c.birth)}</td><td>${esc(c.room)} · ${esc(c.classroom)}</td><td><span class="pill ${c.status==="Ativa"?"green":"red"}">${c.status}</span></td><td><button class="btn small" onclick="openChildView(${c.id})">Abrir ficha</button></td></tr>`).join("")}</tbody></table></div>`}
function childrenPage(){let list=db.children.filter(c=>role==="Administrador"||c.room==="Sala A");return head("Cadastros","Crianças","Dados cadastrais, sala atual e ficha individual.",role==="Administrador"?`<button class="btn primary" onclick="openChild()">＋ Nova criança</button>`:"")+`<div class="toolbar"><input class="search" id="childSearch" placeholder="Buscar pelo nome..." oninput="filterChildren()"><span class="pill">${list.length} registros</span></div><div id="childrenTable">${tableChildren(list)}</div>`}
function filterChildren(){let q=$("#childSearch").value.toLowerCase();let list=db.children.filter(c=>(role==="Administrador"||c.room==="Sala A")&&c.name.toLowerCase().includes(q));$("#childrenTable").innerHTML=tableChildren(list)}
function openChild(id){let c=db.children.find(x=>x.id===id)||{};$("#modalTitle").textContent=id?"Editar criança":"Cadastrar criança";$("#modalBody").innerHTML=`<form onsubmit="saveChild(event,${id||0})"><div class="field"><label>Nome da criança *</label><input name="name" required value="${esc(c.name||"")}"></div><div class="two"><div class="field"><label>Data de nascimento</label><input type="date" name="birth" value="${esc(c.birth||"")}"></div><div class="field"><label>Status</label><select name="status"><option ${c.status!=="Inativa"?"selected":""}>Ativa</option><option ${c.status==="Inativa"?"selected":""}>Inativa</option></select></div></div><div class="two"><div class="field"><label>Sala</label><select name="room">${db.rooms.map(r=>`<option ${c.room===r.name?"selected":""}>${esc(r.name)}</option>`).join("")}</select></div><div class="field"><label>Turma</label><input name="classroom" value="${esc(c.classroom||"")}"></div></div><div class="actions"><button class="btn primary" type="submit">Salvar cadastro</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`;showModal()}
function saveChild(e,id){e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());if(id){Object.assign(db.children.find(c=>c.id===id),data);log("Cadastro editado",data.name)}else{db.children.push({id:Date.now(),...data,observations:[],attendance:{}});log("Criança cadastrada",data.name)}save();closeModal();render();toast("Cadastro salvo nesta prévia.")}
function openChildView(id){selectedChild=id;page="Ficha individual";render()}
function childPage(){let c=db.children.find(x=>x.id===selectedChild)||db.children[0];if(!c)return head("Cadastros","Ficha individual","Nenhuma criança selecionada.")+`<button class="btn" onclick="go('Crianças')">Voltar à lista</button>`;let obs=c.observations||[];return head("Acompanhamento individual","Ficha da criança",esc(c.name),`<button class="btn" onclick="go('Crianças')">← Voltar</button>`)+`<div class="card"><div class="tabs"><button class="${childTab==="Dados cadastrais"?"active":""}" onclick="childTab='Dados cadastrais';render()">Dados cadastrais</button><button class="${childTab==="Histórico"?"active":""}" onclick="childTab='Histórico';render()">Histórico</button></div>${childTab==="Dados cadastrais"?`<div class="two"><div><div class="muted smalltext">Nome</div><b>${esc(c.name)}</b></div><div><div class="muted smalltext">Nascimento</div><b>${dateBR(c.birth)}</b></div><div><div class="muted smalltext">Sala atual</div><b>${esc(c.room)}</b></div><div><div class="muted smalltext">Turma atual</div><b>${esc(c.classroom)}</b></div><div><div class="muted smalltext">Status</div><span class="pill ${c.status==="Ativa"?"green":"red"}">${c.status}</span></div></div>${role==="Administrador"?`<div style="margin-top:18px"><button class="btn" onclick="openChild(${c.id})">Editar dados</button></div>`:""}`:`<h3 class="section-title">Histórico cronológico</h3><h4>Frequência</h4>${Object.entries(c.attendance||{}).length?Object.entries(c.attendance).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,s])=>`<p class="smalltext">${dateBR(d)} · <span class="pill ${s==="Presente"?"green":"red"}">${s}</span></p>`).join(""):`<p class="muted smalltext">Sem registros de frequência.</p>`}<h4>Observações e ocorrências</h4>${obs.length?`<div class="timeline">${obs.slice().reverse().map(o=>`<div class="timeline-item"><b>${esc(o.category)}</b><div>${esc(o.text)}</div><div class="muted smalltext">${dateBR(o.date)} · ${esc(o.author)}</div></div>`).join("")}</div>`:`<p class="muted smalltext">Nenhuma observação registrada.</p>`}`}</div>${role==="Administrador"||role==="Monitor"?`<section class="card" style="margin-top:14px"><h3 class="section-title">Registrar observação individual</h3><form onsubmit="addObservation(event,${c.id})"><div class="two"><div class="field"><label>Categoria</label><select name="category"><option>Observação</option><option>Ocorrência</option></select></div><div class="field"><label>Data</label><input type="date" name="date" value="${today()}" required></div></div><div class="field"><label>Descrição</label><textarea name="text" rows="3" required placeholder="Escreva a observação..."></textarea></div><button class="btn primary">Registrar observação</button></form></section>`:""}`}
function addObservation(e,id){e.preventDefault();let c=db.children.find(x=>x.id===id),f=Object.fromEntries(new FormData(e.target));c.observations.push({...f,author:role});log("Observação registrada",c.name);save();render();toast("Observação adicionada ao histórico.")}
function roomsPage(){return head("Organização","Salas e turmas","Criar, editar, organizar e realocar crianças.",`<button class="btn primary" onclick="openRoom()">＋ Nova sala</button>`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${db.rooms.map(r=>`<div class="card"><div class="stat"><b>${esc(r.name)}</b><span class="pill ${r.active?"green":"red"}">${r.active?"Ativa":"Inativa"}</span></div><h2 style="margin:13px 0 3px">${db.children.filter(c=>c.room===r.name&&c.status==="Ativa").length} crianças</h2><div class="muted smalltext">${esc(r.classroom)} · ${esc(r.monitor)}</div><div style="margin-top:15px"><button class="btn small" onclick="openRoom(${r.id})">Editar sala</button></div></div>`).join("")}</div><div class="card" style="margin-top:14px"><h3 class="section-title">Realocação de crianças</h3><p class="muted smalltext">Altere a sala no cadastro da criança. O histórico anterior permanece registrado.</p><button class="btn" onclick="go('Crianças')">Consultar cadastros</button></div>`}
function openRoom(id){let r=db.rooms.find(x=>x.id===id)||{};$("#modalTitle").textContent=id?"Editar sala":"Cadastrar sala";$("#modalBody").innerHTML=`<form onsubmit="saveRoom(event,${id||0})"><div class="field"><label>Nome da sala *</label><input name="name" required value="${esc(r.name||"")}"></div><div class="field"><label>Turma</label><input name="classroom" value="${esc(r.classroom||"")}"></div><div class="field"><label>Monitor vinculado</label><input name="monitor" value="${esc(r.monitor||"")}"></div><div class="field"><label>Status</label><select name="active"><option value="true" ${r.active!==false?"selected":""}>Ativa</option><option value="false" ${r.active===false?"selected":""}>Inativa</option></select></div><button class="btn primary">Salvar sala</button></form>`;showModal()}
function saveRoom(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.active=d.active==="true";if(id)Object.assign(db.rooms.find(r=>r.id===id),d);else db.rooms.push({id:Date.now(),...d});log(id?"Sala editada":"Sala cadastrada",d.name);save();closeModal();render();toast("Sala salva.")}
function attendancePage(){let date=today();return head("Frequência","Controle de presença","Registro por data e sala, justificativas e correções.")+`<div class="toolbar"><label class="smalltext">Data <input type="date" id="attDate" value="${date}" class="search" style="max-width:165px" onchange="renderAttendanceTable()"></label><label class="smalltext">Sala <select id="attRoom" class="search" style="max-width:180px" onchange="renderAttendanceTable()"><option value="">Todas as salas</option>${db.rooms.map(r=>`<option>${esc(r.name)}</option>`).join("")}</select></label></div><div id="attendanceTable">${attendanceTable(date,"")}</div>`}
function attendanceTable(date,room){let list=db.children.filter(c=>c.status==="Ativa"&&(!room||c.room===room)&&(role==="Administrador"||c.room==="Sala A"));return list.length?`<div class="table-wrap"><table><thead><tr><th>Criança</th><th>Sala</th><th>Frequência</th><th>Justificativa</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.room)}</td><td><select onchange="setAttendance(${c.id},'${date}',this.value)"><option value="">Não registrado</option><option ${c.attendance?.[date]==="Presente"?"selected":""}>Presente</option><option ${c.attendance?.[date]==="Ausente"?"selected":""}>Ausente</option></select></td><td><input placeholder="Justificativa (se ausente)" value="${esc(c.attendance?.[date+"-just"]||"")}" onchange="setJustification(${c.id},'${date}',this.value)"></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma criança encontrada para os filtros selecionados.</div>`}
function renderAttendanceTable(){let d=$("#attDate").value||today(),r=$("#attRoom").value;$("#attendanceTable").innerHTML=attendanceTable(d,r)}
function setAttendance(id,date,value){let c=db.children.find(x=>x.id===id);c.attendance=c.attendance||{};if(value)c.attendance[date]=value;else delete c.attendance[date];log("Frequência atualizada",c.name+" · "+dateBR(date)+" · "+(value||"Não registrado"));save();toast("Frequência atualizada.")}
function setJustification(id,date,value){let c=db.children.find(x=>x.id===id);c.attendance=c.attendance||{};c.attendance[date+"-just"]=value;log("Justificativa atualizada",c.name);save();toast("Justificativa salva.")}
function monitorsPage(){return head("Acessos","Monitores","Cadastrar, editar, ativar e inativar usuários.",`<button class="btn primary" onclick="openMonitor()">＋ Novo monitor</button>`)+`<div class="table-wrap"><table><thead><tr><th>Monitor</th><th>Sala vinculada</th><th>Status</th><th></th></tr></thead><tbody>${db.monitors.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.room)}</td><td><span class="pill ${m.active?"green":"red"}">${m.active?"Ativo":"Inativo"}</span></td><td><button class="btn small" onclick="openMonitor(${m.id})">Editar</button></td></tr>`).join("")}</tbody></table></div>`}
function openMonitor(id){let m=db.monitors.find(x=>x.id===id)||{};$("#modalTitle").textContent=id?"Editar monitor":"Cadastrar monitor";$("#modalBody").innerHTML=`<form onsubmit="saveMonitor(event,${id||0})"><div class="field"><label>Nome do monitor *</label><input name="name" required value="${esc(m.name||"")}"></div><div class="field"><label>Sala atribuída</label><select name="room">${db.rooms.map(r=>`<option ${m.room===r.name?"selected":""}>${esc(r.name)}</option>`).join("")}</select></div><div class="field"><label>Status</label><select name="active"><option value="true" ${m.active!==false?"selected":""}>Ativo</option><option value="false" ${m.active===false?"selected":""}>Inativo</option></select></div><button class="btn primary">Salvar monitor</button></form>`;showModal()}
function saveMonitor(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.active=d.active==="true";if(id)Object.assign(db.monitors.find(m=>m.id===id),d);else db.monitors.push({id:Date.now(),...d});log(id?"Monitor editado":"Monitor cadastrado",d.name);save();closeModal();render();toast("Monitor salvo.")}
function importPage(){return head("Cadastro em massa","Importação de planilhas","Enviar, validar, revisar e importar registros.")+`<div class="grid split"><section class="card"><h3 class="section-title">1. Enviar planilha</h3><div class="filebox"><div style="font-size:30px;color:var(--red)">⇧</div><p><b>Selecione um arquivo CSV</b></p><p class="muted smalltext">Prévia local: CSV com colunas nome, nascimento, sala e turma.</p><input type="file" id="csvFile" accept=".csv,text/csv" onchange="readCSV(event)"></div><p class="muted smalltext">Modelo de colunas: nome,nascimento,sala,turma</p><button class="btn" onclick="downloadTemplate()">⇩ Baixar modelo CSV</button></section><section class="card"><h3 class="section-title">Etapas da importação</h3><ol class="muted smalltext" style="line-height:2"><li>Enviar arquivo Excel ou CSV</li><li>Validar colunas e campos obrigatórios</li><li>Revisar registros válidos e erros</li><li>Confirmar importação e gerar relatório</li></ol><div class="notice">Nesta prévia, a leitura funcional é de CSV. A importação de arquivos Excel (.xlsx) deverá ser conectada na implementação definitiva.</div></section></div><div id="importPreview" style="margin-top:15px"></div>`}
function downloadTemplate(){let blob=new Blob(["nome,nascimento,sala,turma\\nCriança demonstrativa,2018-01-01,Sala A,Turma 1"],{type:"text/csv;charset=utf-8"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="modelo_importacao_criancas.csv";a.click();URL.revokeObjectURL(a.href)}
function readCSV(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let lines=String(reader.result).split(/\\r?\\n/).filter(x=>x.trim());let headers=lines.shift().split(",").map(x=>x.trim().toLowerCase());let required=["nome","nascimento","sala","turma"];let missing=required.filter(x=>!headers.includes(x));importRows=[];importErrors=[];if(missing.length){importErrors.push("Colunas ausentes: "+missing.join(", "));}else lines.forEach((line,i)=>{let vals=line.split(",").map(x=>x.trim()),obj={};headers.forEach((h,j)=>obj[h]=vals[j]||"");if(!obj.nome)importErrors.push("Linha "+(i+2)+": nome obrigatório.");else if(db.children.some(c=>c.name.toLowerCase()===obj.nome.toLowerCase())||importRows.some(c=>c.nome.toLowerCase()===obj.nome.toLowerCase()))importErrors.push("Linha "+(i+2)+": possível duplicidade — "+obj.nome);else importRows.push(obj)});renderImportPreview(file.name)};reader.readAsText(file,"UTF-8")}
function renderImportPreview(name){$("#importPreview").innerHTML=`<section class="card"><h3 class="section-title">2. Revisar importação · ${esc(name)}</h3><div class="toolbar"><span class="pill green">${importRows.length} válidos</span><span class="pill red">${importErrors.length} erros</span></div>${importErrors.length?`<div class="notice" style="margin-bottom:12px">${importErrors.map(esc).join("<br>")}</div>`:""}${importRows.length?`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Nascimento</th><th>Sala</th><th>Turma</th></tr></thead><tbody>${importRows.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.nascimento)}</td><td>${esc(r.sala)}</td><td>${esc(r.turma)}</td></tr>`).join("")}</tbody></table></div><button class="btn primary" style="margin-top:13px" onclick="confirmImport()">3. Confirmar importação (${importRows.length})</button>`:`<div class="empty">Nenhum registro válido para importar.</div>`}</section>`}
function confirmImport(){if(!importRows.length)return;let n=0;importRows.forEach(r=>{if(!db.children.some(c=>c.name.toLowerCase()===r.nome.toLowerCase())){db.children.push({id:Date.now()+n++,name:r.nome,birth:r.nascimento,room:r.sala,classroom:r.turma,status:"Ativa",observations:[],attendance:{}})}});log("Importação realizada",n+" registros importados");save();importRows=[];$("#importPreview").innerHTML=`<div class="notice">Importação concluída. ${n} registros foram adicionados à prévia.</div>`;toast("Importação concluída.")}
function auditPage(){return head("Rastreabilidade","Histórico e auditoria","Consulte alterações, autores, datas e ações realizadas.")+(db.audit.length?`<div class="table-wrap"><table><thead><tr><th>Data e hora</th><th>Ação</th><th>Detalhe</th><th>Autor</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td><td>${esc(a.author)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty"><b>Nenhuma alteração registrada</b>As ações realizadas nesta prévia aparecerão aqui.</div>`)}
function showModal(){$("#modalBack").classList.add("show")}function closeModal(){$("#modalBack").classList.remove("show")}$("#modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()});
render();
</script></body></html>
